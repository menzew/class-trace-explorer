[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ClassloadGrapher"
version = "0.1.0"
description = "Graph of loaded classes in a jvm"
readme = "README.rst"
license = { text = "new-bsd" }
authors = [{ name = "mzm" }]
requires-python = ">=3.7"
dependencies = [
    "graphviz",
    "importlib-metadata>=4.6; python_version < '3.8'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/menzew/ClassLoadGrapher"

[project.scripts]
clgrapher = "classloadgrapher.clgrapher:run"

[tool.setuptools]
packages = ["classloadgrapher"]
